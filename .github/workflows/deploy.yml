name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings > Pages > Source is still "Deploy from a branch", GitHub also
      # publishes the raw repository on every push, and whichever deployment finishes
      # last is the one visitors get. Waiting here makes this built site finish last.
      # Once the source is set to "GitHub Actions" this step can be removed.
      - name: Let the legacy branch deployment finish first
        run: sleep 75
      - id: deployment
        uses: actions/deploy-pages@v4
